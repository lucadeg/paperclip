<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-psych-cialdini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>
    <linearGradient id="rim-psych-cialdini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.7" />
    </linearGradient>
    <radialGradient id="glow-psych-cialdini" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-psych-cialdini" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="60" cy="60" r="56" fill="url(#bg-psych-cialdini)" stroke="url(#rim-psych-cialdini)" stroke-width="2.5" filter="url(#shadow-psych-cialdini)" />
  
  <!-- Subtle Glow Layer -->
  <circle cx="60" cy="55" r="46" fill="url(#glow-psych-cialdini)" />

  <!-- Inner Architectural Border -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Initials Typography -->
  <text x="60" y="66" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">
    RC
  </text>

  <!-- Leader Subtitle Pill -->
  <rect x="25" y="88" width="70" height="18" rx="9" fill="#18181b" stroke="#ea580c" stroke-width="1.2" />
  <text x="60" y="100.5" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8" fill="#ea580c">
    PSY
  </text>
</svg>